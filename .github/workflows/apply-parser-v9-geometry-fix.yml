name: Apply parser v9 geometry fix

on:
  push:
    branches: [ "rewrite/parser-v9-from-scratch" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          ref: rewrite/parser-v9-from-scratch
          fetch-depth: 0

      - name: Apply structural geometry fix
        shell: bash
        run: |
          set -euxo pipefail
          python3 tools/apply_parser_v9_geometry_fix.py
          rm tools/apply_parser_v9_geometry_fix.py
          rm .github/workflows/apply-parser-v9-geometry-fix.yml

      - name: Commit clean source patch
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "broman77"
          git config user.email "71395385+broman77@users.noreply.github.com"
          git add -A
          git commit -m "Fix structural group and pair column detection"
          git push origin HEAD:rewrite/parser-v9-from-scratch
