name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK 35
        shell: bash
        run: |
          set -euxo pipefail
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download official MGSU brand assets
        shell: bash
        run: |
          set -euxo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 120 \
            "https://api-loft.mgsu.ru/storage/files/1/9/3/193.png" \
            -o app/src/main/res/drawable-nodpi/official_mgsu_logo.png
          curl -L --fail --retry 5 --retry-all-errors --retry-delay 3 \
            --connect-timeout 20 --max-time 120 \
            "https://mgsu.ru/news/2025/02-09-2025-86800648.jpg" \
            -o app/src/main/res/drawable-nodpi/official_campus.jpg
          test -s app/src/main/res/drawable-nodpi/official_mgsu_logo.png
          test -s app/src/main/res/drawable-nodpi/official_campus.jpg
          file app/src/main/res/drawable-nodpi/official_mgsu_logo.png | grep -qi 'PNG image'
          file app/src/main/res/drawable-nodpi/official_campus.jpg | grep -Eqi 'JPEG image|JPG image'

      - name: Verify project inputs
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          gradle --version
          test -f app/beta-debug.keystore
          keytool -list -keystore app/beta-debug.keystore -storepass mgsu_beta -alias mgsu_beta >/dev/null
          grep -q 'versionName = "0.1.0-beta"' app/build.gradle.kts
          grep -q 'versionCode = 10' app/build.gradle.kts

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --console=plain --no-daemon 2>&1 | tee unit-tests.log

      - name: Compile Kotlin
        shell: bash
        run: |
          set -o pipefail
          gradle :app:compileDebugKotlin --stacktrace --console=plain --no-daemon 2>&1 | tee compile.log

      - name: Android lint
        shell: bash
        run: |
          set -o pipefail
          gradle :app:lintDebug --stacktrace --console=plain --no-daemon 2>&1 | tee lint.log

      - name: Build beta APK
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee build.log
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Verify APK signature
        shell: bash
        run: |
          set -euxo pipefail
          APKSIGNER="$ANDROID_HOME/build-tools/35.0.0/apksigner"
          "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signature.log

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs-beta-0.1.0
          path: |
            unit-tests.log
            compile.log
            lint.log
            build.log
            signature.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MGSU-Schedule-beta-0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
