name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Verify project inputs
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          gradle --version
          test -f app/beta-debug.keystore
          keytool -list -keystore app/beta-debug.keystore -storepass mgsu_beta -alias mgsu_beta >/dev/null
          test -s app/src/main/res/drawable-nodpi/official_mgsu_logo.png
          file app/src/main/res/drawable-nodpi/official_mgsu_logo.png | grep -qi 'PNG image'
          grep -q 'versionName = "0.1.0-beta"' app/build.gradle.kts
          grep -q 'versionCode = 12' app/build.gradle.kts

      - name: Unit tests
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --console=plain --no-daemon 2>&1 | tee unit-tests.log

      - name: Build beta APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee build.log
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Android lint
        if: success()
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:lintDebug --stacktrace --console=plain --no-daemon 2>&1 | tee lint.log

      - name: Verify APK signature
        if: success()
        shell: bash
        run: |
          set -euxo pipefail
          APKSIGNER=""
          for candidate in "$ANDROID_HOME"/build-tools/*/apksigner; do
            if [ -x "$candidate" ]; then APKSIGNER="$candidate"; fi
          done
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signature.log
          else
            echo "apksigner not found; APK existence already verified" | tee signature.log
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs-beta-0.1.0
          path: |
            build.log
            unit-tests.log
            lint.log
            signature.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: MGSU-Schedule-beta-0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
