name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Refresh official MGSU launcher logo
        shell: bash
        run: |
          set -u
          TARGET="app/src/main/res/drawable-nodpi/official_mgsu_logo.png"
          TMP="/tmp/mgsu-official-logo.png"
          URL="https://api-loft.mgsu.ru/storage/files/1/9/3/193.png"
          echo "Trying official NIU MGSU logo: $URL"
          if curl -fL --retry 3 --retry-delay 2 --connect-timeout 15 --max-time 60 "$URL" -o "$TMP"; then
            if test -s "$TMP" && file "$TMP" | grep -qi 'PNG image'; then
              cp "$TMP" "$TARGET"
              echo "Official NIU MGSU logo installed for launcher/UI fallback."
            else
              echo "WARNING: downloaded logo is not a valid PNG; keeping bundled fallback."
            fi
          else
            echo "WARNING: official logo host is temporarily unavailable; keeping bundled fallback so beta build can continue."
          fi

      - name: Verify project inputs
        shell: bash
        run: |
          set -euxo pipefail
          java -version
          gradle --version
          test -f app/beta-debug.keystore
          keytool -list -keystore app/beta-debug.keystore -storepass mgsu_beta -alias mgsu_beta >/dev/null
          test -s app/src/main/res/drawable-nodpi/official_mgsu_logo.png
          file app/src/main/res/drawable-nodpi/official_mgsu_logo.png | grep -qi 'PNG image'
          grep -q 'versionName = "0.1.0-beta"' app/build.gradle.kts
          grep -q 'versionCode = 13' app/build.gradle.kts

      # APK compilation is the primary gate. If Kotlin/Android code is broken, this step fails
      # and the error is visible directly instead of being hidden behind a test failure.
      - name: Build beta APK
        id: build
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug --stacktrace --console=plain --no-daemon 2>&1 | tee build.log
          test -s app/build/outputs/apk/debug/app-debug.apk

      # Beta regression tests are diagnostic. A broken test must not prevent testers from
      # receiving an APK when the application itself compiled successfully.
      - name: Unit tests
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:testDebugUnitTest --stacktrace --console=plain --no-daemon 2>&1 | tee unit-tests.log

      - name: Android lint
        if: steps.build.outcome == 'success'
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          gradle :app:lintDebug --stacktrace --console=plain --no-daemon 2>&1 | tee lint.log

      - name: Verify APK signature
        if: steps.build.outcome == 'success'
        shell: bash
        run: |
          set -euxo pipefail
          APKSIGNER=""
          for candidate in "$ANDROID_HOME"/build-tools/*/apksigner; do
            if [ -x "$candidate" ]; then APKSIGNER="$candidate"; fi
          done
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --verbose --print-certs app/build/outputs/apk/debug/app-debug.apk | tee signature.log
          else
            echo "apksigner not found; APK existence already verified" | tee signature.log
          fi

      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validation-logs-beta-0.1.0
          path: |
            build.log
            unit-tests.log
            lint.log
            signature.log
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.html
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload APK
        if: steps.build.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: MGSU-Schedule-beta-0.1.0-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
