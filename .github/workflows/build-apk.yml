name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Download official MGSU brand assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p app/src/main/res/drawable-nodpi
          # Official MGSU logo file served by an MGSU-owned resource host.
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://api-loft.mgsu.ru/storage/files/1/9/3/193.png" \
            -o app/src/main/res/drawable-nodpi/official_mgsu_logo.png
          # Campus photograph used on the official pish.mgsu.ru website.
          curl -L --fail --retry 3 --retry-delay 2 \
            "https://static.tildacdn.com/tild3331-3463-4438-a238-316631623739/__.jpg" \
            -o app/src/main/res/drawable-nodpi/official_campus.jpg
          test -s app/src/main/res/drawable-nodpi/official_mgsu_logo.png
          test -s app/src/main/res/drawable-nodpi/official_campus.jpg

      - name: Create launcher icons from official MGSU logo
        shell: bash
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image
          from pathlib import Path

          root = Path('app/src/main/res')
          logo = Image.open(root/'drawable-nodpi'/'official_mgsu_logo.png').convert('RGBA')
          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              target_dir = root/folder
              target_dir.mkdir(parents=True, exist_ok=True)
              canvas = Image.new('RGBA', (size, size), (255,255,255,255))
              max_w, max_h = int(size*0.80), int(size*0.80)
              copy = logo.copy()
              copy.thumbnail((max_w, max_h), Image.Resampling.LANCZOS)
              x = (size-copy.width)//2
              y = (size-copy.height)//2
              canvas.alpha_composite(copy, (x,y))
              canvas.convert('RGB').save(target_dir/'ic_launcher.png', quality=95)
          PY

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGSU-Schedule-debug
          path: app/build/outputs/apk/debug/app-debug.apk
