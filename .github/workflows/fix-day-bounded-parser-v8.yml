name: Validate parser v8 day boundaries

on:
  push:
    branches: [ "fix/day-bounded-parser-v8" ]

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/day-bounded-parser-v8

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Apply parser v8 patch
        run: python3 tools/fix_day_bounded_parser_v8.py

      - name: Build and unit test
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app:assembleDebug --stacktrace --console=plain --no-daemon
          gradle :app:testDebugUnitTest --stacktrace --console=plain --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "broman77"
          git config user.email "71395385+broman77@users.noreply.github.com"
          git add app/src/main/java/ru/mgsu/schedule/data/PdfScheduleParser.kt \
                  app/src/main/java/ru/mgsu/schedule/data/AppStore.kt \
                  app/src/test/java/ru/mgsu/schedule/data/LessonRowGeometryTest.kt \
                  CHANGELOG.md
          if ! git diff --cached --quiet; then
            git commit -m "Bound lesson parsing to each weekday"
            git push origin HEAD:fix/day-bounded-parser-v8
          fi

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MGSU-Schedule-parser-v8-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
