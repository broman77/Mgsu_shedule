name: Validate parser v9 rewrite

on:
  push:
    branches: [ "rewrite/parser-v9-from-scratch" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout parser branch
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Download current official MGSU PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-pdfs
          base_path="/student/Raspisanie_zanyatii_i_ekzamenov/fayly-raspisaniya-dlya-skachivaniya"
          fetch_pdf() {
            local file="$1"; shift
            for host in "$@"; do
              url="https://${host}${base_path}/${file}"
              echo "Trying ${url}"
              if curl -fL --retry 2 --connect-timeout 15 --max-time 90 \
                -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
                -e "https://${host}${base_path}/" "$url" -o "live-pdfs/${file}"; then
                if head -c 4 "live-pdfs/${file}" | grep -q '%PDF'; then
                  echo "Downloaded ${file} from ${host}"
                  return 0
                fi
              fi
              rm -f "live-pdfs/${file}"
            done
            echo "Could not download ${file}" >&2
            return 1
          }
          hosts=(mgsu.ru www.mgsu.ru iiesm.mgsu.ru www-20.mgsu.ru)
          fetch_pdf IPGSb_1k_0610.pdf "${hosts[@]}"
          fetch_pdf IGES_1k.pdf "${hosts[@]}"
          fetch_pdf IIESM_1k_0210.pdf "${hosts[@]}"
          fetch_pdf IAG_1k_0826_20.pdf "${hosts[@]}"
          ls -lh live-pdfs

      - name: Extract independent table-rule fixtures
        shell: bash
        run: |
          set -euxo pipefail
          python3 -m pip install --disable-pip-version-check --quiet 'PyMuPDF==1.26.5'
          mkdir -p live-rules
          python3 - <<'PY'
          from pathlib import Path
          import fitz

          for pdf in sorted(Path('live-pdfs').glob('*.pdf')):
              doc = fitz.open(pdf)
              rows = []
              for page_no, page in enumerate(doc, 1):
                  for drawing in page.get_drawings():
                      for item in drawing.get('items', []):
                          if item[0] == 'l':
                              a, b = item[1], item[2]
                              if abs(a.x - b.x) <= 2.2 or abs(a.y - b.y) <= 2.2:
                                  rows.append((page_no, a.x, a.y, b.x, b.y))
                          elif item[0] == 're':
                              r = item[1]
                              rows.extend([
                                  (page_no, r.x0, r.y0, r.x1, r.y0),
                                  (page_no, r.x1, r.y0, r.x1, r.y1),
                                  (page_no, r.x1, r.y1, r.x0, r.y1),
                                  (page_no, r.x0, r.y1, r.x0, r.y0),
                              ])
              unique = {}
              for row in rows:
                  key = tuple(round(v * 2) if i else v for i, v in enumerate(row))
                  unique.setdefault(key, row)
              out = Path('live-rules') / f'{pdf.name}.rules.tsv'
              with out.open('w', encoding='utf-8') as fh:
                  fh.write('# page\tx1\ty1\tx2\ty2\n')
                  for row in unique.values():
                      fh.write('%d\t%.3f\t%.3f\t%.3f\t%.3f\n' % row)
              print(pdf.name, 'rules=', len(unique), 'pages=', len(doc))
          PY
          ls -lh live-rules

      - name: Upload exact live fixtures
        uses: actions/upload-artifact@v4
        with:
          name: parser-v9-live-fixtures
          path: |
            live-pdfs/
            live-rules/
          if-no-files-found: error
          retention-days: 3

      - name: Unit tests plus live official-PDF verification
        id: tests
        shell: bash
        continue-on-error: true
        env:
          MGSU_LIVE_DIR: ${{ github.workspace }}/live-pdfs
          MGSU_RULE_DIR: ${{ github.workspace }}/live-rules
        run: |
          set -euxo pipefail
          gradle :app:testDebugUnitTest --stacktrace --console=plain --no-daemon

      - name: Upload live parser diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: parser-v9-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn
          retention-days: 7

      - name: Fail if parser tests failed
        if: steps.tests.outcome != 'success'
        shell: bash
        run: exit 1

      - name: Build debug APK
        shell: bash
        run: |
          set -euxo pipefail
          gradle :app:assembleDebug --stacktrace --console=plain --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Upload parser v9 APK
        uses: actions/upload-artifact@v4
        with:
          name: MGSU-Schedule-parser-v9-live-validated
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
