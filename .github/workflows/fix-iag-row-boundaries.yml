name: Validate IAG row-boundary parser fix

on:
  push:
    branches: [ "fix/iag-row-boundaries" ]
    paths:
      - "tools/fix_iag_row_boundaries.py"
      - ".github/workflows/fix-iag-row-boundaries.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: fix/iag-row-boundaries

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"

      - name: Apply parser patch
        run: python3 tools/fix_iag_row_boundaries.py

      - name: Build and test
        shell: bash
        run: |
          set -o pipefail
          gradle :app:assembleDebug :app:testDebugUnitTest --stacktrace --console=plain --no-daemon 2>&1 | tee iag-row-fix-build.log
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Commit validated source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/java/ru/mgsu/schedule/data/PdfScheduleParser.kt \
                  app/src/main/java/ru/mgsu/schedule/data/AppStore.kt \
                  CHANGELOG.md
          if git diff --cached --quiet; then
            echo "No source changes to commit"
          else
            git commit -m "Fix split-time PDF row boundaries"
            git push origin HEAD:fix/iag-row-boundaries
          fi

      - name: Upload validation artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: iag-row-boundary-validation
          path: |
            iag-row-fix-build.log
            app/build/outputs/apk/debug/app-debug.apk
            app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
          retention-days: 7
