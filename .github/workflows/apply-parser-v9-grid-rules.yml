name: Apply parser v9 exact grid rules

on:
  push:
    branches: [ "rewrite/parser-v9-from-scratch" ]

permissions:
  contents: write

jobs:
  apply-and-verify:
    if: github.event.head_commit.message == 'Apply parser v9 exact grid rules'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout branch
        uses: actions/checkout@v6
        with:
          ref: rewrite/parser-v9-from-scratch
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      - name: Apply exact-grid parser patch
        run: python3 tools/apply_parser_v9_grid_rules.py

      - name: Download current official MGSU PDFs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p live-pdfs
          base_path="/student/Raspisanie_zanyatii_i_ekzamenov/fayly-raspisaniya-dlya-skachivaniya"
          fetch_pdf() {
            local file="$1"; shift
            for host in "$@"; do
              url="https://${host}${base_path}/${file}"
              if curl -fL --retry 2 --connect-timeout 15 --max-time 90 \
                -A 'Mozilla/5.0 (Linux; Android 16) AppleWebKit/537.36 Chrome/140 Safari/537.36' \
                -e "https://${host}${base_path}/" "$url" -o "live-pdfs/${file}"; then
                if head -c 4 "live-pdfs/${file}" | grep -q '%PDF'; then return 0; fi
              fi
              rm -f "live-pdfs/${file}"
            done
            return 1
          }
          hosts=(mgsu.ru www.mgsu.ru iiesm.mgsu.ru www-20.mgsu.ru)
          fetch_pdf IPGSb_1k_0610.pdf "${hosts[@]}"
          fetch_pdf IGES_1k.pdf "${hosts[@]}"
          fetch_pdf IIESM_1k_0210.pdf "${hosts[@]}"
          fetch_pdf IAG_1k_0826_20.pdf "${hosts[@]}"

      - name: Compile and run all parser tests against live PDFs
        env:
          MGSU_LIVE_DIR: ${{ github.workspace }}/live-pdfs
        run: |
          set -euxo pipefail
          gradle :app:testDebugUnitTest --stacktrace --console=plain --no-daemon
          gradle :app:assembleDebug --stacktrace --console=plain --no-daemon
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Commit verified parser source
        shell: bash
        run: |
          set -euxo pipefail
          git config user.name "broman77"
          git config user.email "71395385+broman77@users.noreply.github.com"
          git add app/src/main/java/ru/mgsu/schedule/data/MgsuGridParserCore.kt \
                  app/src/test/java/ru/mgsu/schedule/data/LiveMgsuGridParserTest.kt
          git rm tools/apply_parser_v9_grid_rules.py .github/workflows/apply-parser-v9-grid-rules.yml
          git commit -m "Use exact PDF grid cells in parser v9"
          git push origin HEAD:rewrite/parser-v9-from-scratch
